    <script>

  // Obtenir token
const token = localStorage.getItem('jwtToken');

  if (!token) {
    window.location.href = 'login.html';
  }

  async function carregarLastGames() {
    try {
      const response = await fetch('http://localhost/api/get_user_last_games', {
        headers: {
          'Authorization': 'Bearer ' + token
        }
      });
      if (!response.ok) throw new Error('Error ' + response.status);

      const result = await response.json();
      if (result.status !== 'ok') throw new Error('Error de resposta API');

      const partides = result.partides;

      const table = document.getElementById('lastGamesTable');
      table.innerHTML = '';

      partides.forEach(p => {
        table.innerHTML += `
          <tr>
            <td>${new Date(p.data).toLocaleString()}</td>
            <td>${p.guanyat ? 'Sí' : 'No'}</td>
            <td>${p.punts}</td>
            <td>${p.durada}</td>
          </tr>
        `;
      });
    } catch (error) {
      console.error('Error carregant les últimes partides:', error);
      alert('Error carregant les últimes partides: ' + error.message);
    }
  }

  carregarLastGames();
</script>
