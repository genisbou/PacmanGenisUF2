<body>
  <div class="topnav">
    <a href="home.html">HOME</a>

    <a href="help.html">HELP</a>

      <a href="logout.html">LOGOUT</a>
    </div>
  </div>

  <div class="w3-container w3-left">
    <h2>My account</h2>

    <div id="loggedStatus" style="margin-bottom:20px; font-weight: bold;"></div>

    <form id="updateUserForm" class="w3-container w3-card-4 w3-padding" style="max-width:400px;">
      <label for="mail"><b>Email</b></label>
      <input class="w3-input w3-border" type="email" id="mail" name="mail" required>

      <label for="pais" style="margin-top:12px;"><b>País</b></label>
      <input class="w3-input w3-border" type="text" id="pais" name="pais" required>

      <button type="submit" class="w3-button w3-blue w3-margin-top">Actualitzar</button>
    </form>

    <div id="responseMsg" style="margin-top:20px;"></div>
  </div>

  <script>
    const token = localStorage.getItem('jwtToken');
    const loggedStatus = document.getElementById('loggedStatus');

    if (!token) {
      window.location.href = 'login.html';
    } else {
      checkLogged(); // executem comprovació
    }

    async function checkLogged() {
      try {
        const res = await fetch('http://localhost/api/logged', {
          method: 'GET',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (res.status === 200) {
          const data = await res.json();
          if (data.status === 'ok' && data.logged === true) {
            loggedStatus.innerHTML = ' Usuari loguejat correctament.';
          } else {
            loggedStatus.innerHTML = ' No autoritzat. Redirigint...';
            setTimeout(() => window.location.href = 'login.html', 1500);
          }
        } else {
          loggedStatus.innerHTML = ' Error d\'autenticació. Redirigint...';
          setTimeout(() => window.location.href = 'login.html', 1500);
        }
      } catch (error) {
        console.error('Error en la validació del login:', error);
        loggedStatus.innerHTML = 'Error de connexió. Redirigint...';
        setTimeout(() => window.location.href = 'login.html', 1500);
      }
    }

    const form = document.getElementById('updateUserForm');
    const responseMsg = document.getElementById('responseMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const mail = form.mail.value.trim();
      const pais = form.pais.value.trim();

      if (!mail || !pais) {
        responseMsg.innerHTML = '<span style="color:red;">Omple tots els camps</span>';
        return;
      }

      try {
        const res = await fetch('http://localhost/api/update_user', {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify({ mail, pais })
        });

        const data = await res.json();

        if (res.status === 200 && data.status === 'ok') {
          responseMsg.innerHTML = '<span style="color:green;">' + data.message + '</span>';
        } else {
          responseMsg.innerHTML = '<span style="color:red;">' + (data.message || 'Error actualitzant') + '</span>';
        }
      } catch (error) {
        responseMsg.innerHTML = '<span style="color:red;">Error de connexió</span>';
        console.error(error);
      }
    });
  </script>
</body>

</html>
