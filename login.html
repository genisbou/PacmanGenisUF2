<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <style>
    body {
      background-color: aquamarine;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

<!-- Container (Login Section) -->
<div class="w3-container w3-content w3-center w3-padding-64" style="max-width:500px">
  <form id="loginForm" class="w3-container w3-card-4 w3-white w3-round w3-margin">
    <div class="w3-section">
      <label>Usuari</label>
      <input id="username" class="w3-input w3-border w3-margin-bottom" type="text" placeholder="Nom d'usuari" required>
    </div>
    <div class="w3-section">
      <label>Contrasenya</label>
      <input id="password" class="w3-input w3-border" type="password" placeholder="Contrasenya" required>
    </div>
    <button class="w3-button w3-block w3-green w3-section w3-padding" type="submit">Entrar</button>

    <div class="w3-center w3-padding-16">
      <p>No tens compte? <a href="signup.html" class="w3-text-blue">Registra't</a></p>
    </div>
  </form>
</div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function(event) {
    event.preventDefault();

    const usernameInput = document.getElementById('username').value;
    const passwordInput = document.getElementById('password').value;

    // Crida a la API
    fetch('http://localhost/api/login', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        nom_usuari: usernameInput,
        password_usuari: passwordInput
      })
    })
      .then(response => response.json())
      .then(data => {
        console.log(data); // Debug

        if (data.status === 200 && data.token) {
          // Guardem token i nom d'usuari
          localStorage.setItem('jwt_token', data.token);
          localStorage.setItem('usuariConnectat', usernameInput);

          // Redirigim al dashboard
          window.location.href = 'dashboard.html';
        } else {
          alert('Usuari o contrasenya incorrectes');
        }
      })
      .catch(error => {
        console.error('Error en la crida a l API:', error);
        alert('Error en la connexió');
      });
  });
</script>

</body>
</html>
