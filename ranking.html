    <div class="w3-container w3-left">
       <h2>Top Ranking</h2>

<label for="numPlayers">Quants jugadors vols veure?</label>
<select id="numPlayers" class="w3-select w3-border" style="width:200px">
  <option value="10">Top 10</option>
  <option value="20">Top 20</option>
  <option value="30" selected>Top 30</option>
</select>

<table class="w3-table-all w3-hoverable w3-margin-top">
  <thead>
    <tr>
      <th onclick="ordenarPer('posicio')">Posició ⬍</th>
      <th onclick="ordenarPer('name')">Nom ⬍</th>
      <th onclick="ordenarPer('points')">Punts ⬍</th>
    </tr>
  </thead>
  <tbody id="rankingTable">
  </tbody>
</table>

<script>
// Comprovar si està loguejat
if (!localStorage.getItem('usuariConnectat')) {
  window.location.href = 'login.html';
}

// Array de jugadors simulats
const users = [];
for (let i = 1; i <= 30; i++) {
  users.push({
    posicio: i,
    name: 'Jugador' + i,
    points: Math.floor(Math.random() * 10000)
  });
}

function mostrarRanking(num) {
  const table = document.getElementById('rankingTable');
  table.innerHTML = '';

  const seleccionats = users.slice(0, num);

  seleccionats.forEach(user => {
    table.innerHTML += `
      <tr>
        <td>${user.posicio}</td>
        <td>${user.name}</td>
        <td>${user.points}</td>
      </tr>
    `;
  });
}

document.getElementById('numPlayers').addEventListener('change', function() {
  mostrarRanking(this.value);
});

function ordenarPer(camp) {
  users.sort((a, b) => {
    if (camp === 'name') {
      return a.name.localeCompare(b.name);
    } else {
      return a[camp] - b[camp];
    }
  });
  mostrarRanking(document.getElementById('numPlayers').value);
}

// Inicial
mostrarRanking(30);
</script>
