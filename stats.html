       <h2>Les Meves Estadístiques</h2>

<table class="w3-table-all w3-hoverable">
  <thead>
    <tr>
      <th>Partides Totals</th>
      <th>Guanyades</th>
      <th>Perdudes</th>
      <th>Punts Aconseguits</th>
    </tr>
  </thead>
  <tbody id="statsTable">
  </tbody>
</table>

<script>
// Comprovar si està loguejat
if (!localStorage.getItem('usuariConnectat')) {
  window.location.href = 'login.html';
}

// Obtenir token
const token = localStorage.getItem('jwtToken');

fetch('http://localhost/api/get_user_stats', {
  method: 'GET',
  headers: {
    'Authorization': 'Bearer ' + token
  }
})
  .then(response => response.json())
  .then(data => {
    console.log(data); // Debug per veure què retorna

    if (data.status === 200) {
      // Mostrar les estadístiques reals
      document.getElementById('statsTable').innerHTML = `
        <tr>
          <td>${data.total}</td>
          <td>${data.guanyades}</td>
          <td>${data.perdudes}</td>
          <td>${data.mitjana_punts}</td>
        </tr>
      `;
    } else {
      alert('Error en obtenir les estadístiques: ' + data.message);
    }
  })
  .catch(error => {
    console.error('Error en la crida a l\'API:', error);
    alert('Error en obtenir les estadístiques: ' + error.message);
  });



// Crida la funció quan es carregui la pàgina
getUserStats();
</script>
